# StyleSnap - Manual Deployment Workflow
# Manually trigger builds, tests, or maintenance tasks

name: Manual Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - 'build-only'
          - 'test-only'
          - 'full-ci'
          - 'purge-old-items'
          - 'cloudinary-cleanup'
      environment:
        description: 'Environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - 'staging'
          - 'production'

jobs:
  manual-operation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run selected operation
      run: |
        case "${{ inputs.operation }}" in
          "build-only")
            echo "Building for ${{ inputs.environment }}..."
            npm run build
            ;;
          "test-only")
            echo "Running tests..."
            npm test
            ;;
          "full-ci")
            echo "Running full CI pipeline..."
            npm run lint
            npm run build
            npm test
            ;;
          "purge-old-items")
            echo "⚠️  Running purge-old-items script (DRY RUN)..."
            npm run purge-old-items -- --dry-run
            ;;
          "cloudinary-cleanup")
            echo "⚠️  Running cloudinary-cleanup script (DRY RUN)..."
            npm run cloudinary-cleanup -- --dry-run
            ;;
        esac
      env:
        NODE_ENV: ${{ inputs.environment }}
    
    - name: Operation completed
      run: echo "✅ Operation '${{ inputs.operation }}' completed for ${{ inputs.environment }}"
