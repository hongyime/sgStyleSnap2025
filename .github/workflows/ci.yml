name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stylesnap-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      # Isolated app mode: smoke tests must never contact production services.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_CLOUDINARY_CLOUD_NAME: ''
      VITE_CLOUDINARY_UPLOAD_PRESET: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:media-access
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run test:media-views
      - run: npm run test:uploads
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stylesnap-smoke-failure
          path: test-results/
          retention-days: 3
