name: Private media manifest

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bounded read-only inventory stage
        type: choice
        default: manifest_only
        options:
          - manifest_only
          - derived_probe
  pull_request:
    paths:
      - .github/workflows/media-manifest.yml
      - scripts/stylesnap_media.py
      - tests/maintenance/test_stylesnap_media.py
  push:
    branches: [main]
    paths:
      - .github/workflows/media-manifest.yml
      - scripts/stylesnap_media.py
      - tests/maintenance/test_stylesnap_media.py

permissions:
  contents: read

concurrency:
  group: stylesnap-private-media-manifest
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/maintenance -p test_stylesnap_media.py -v

  manifest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inventory privately and report aggregates
        run: python3 scripts/stylesnap_media.py
        env:
          STYLESNAP_MANIFEST_PHASE: ${{ inputs.phase }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STYLESNAP_PRIVATE_MANIFEST: ${{ runner.temp }}/stylesnap-media-manifest.json
      # No artifact upload. Private source metadata leaves with the ephemeral runner.
