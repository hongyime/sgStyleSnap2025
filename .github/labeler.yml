# Retained legacy configuration, using the current actions/labeler schema.
frontend:
- changed-files:
  - any-glob-to-any-file:
    - src/components/**
    - src/pages/**
    - src/composables/**
    - src/stores/**
    - src/services/**
    - src/utils/**
    - src/assets/**
    - src/index.css
    - src/main.js
database:
- changed-files:
  - any-glob-to-any-file:
    - database/migrations/**
    - database/**/*.sql
    - supabase/**
api:
- changed-files:
  - any-glob-to-any-file:
    - api/**
    - '*.js'
    - '*.ts'
edge-function:
- changed-files:
  - any-glob-to-any-file:
    - supabase/functions/**
documentation:
- changed-files:
  - any-glob-to-any-file:
    - docs/**
    - '*.md'
    - README.md
    - CHANGELOG.md
tests:
- changed-files:
  - any-glob-to-any-file:
    - tests/**
    - '**/*.test.js'
    - '**/*.test.ts'
    - '**/*.spec.js'
    - '**/*.spec.ts'
    - playwright.config.js
ci:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/**
    - .github/labeler.yml
    - .github/**
config:
- changed-files:
  - any-glob-to-any-file:
    - '*.config.js'
    - '*.config.ts'
    - '*.json'
    - package.json
    - package-lock.json
    - tsconfig.json
    - tailwind.config.js
    - vite.config.ts
    - postcss.config.js
    - vercel.json
    - .env.example
styles:
- changed-files:
  - any-glob-to-any-file:
    - src/**/*.css
    - src/tokens/**
    - tailwind.config.js
    - postcss.config.js
dependencies:
- changed-files:
  - any-glob-to-any-file:
    - package.json
    - package-lock.json
